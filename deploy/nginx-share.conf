# inside the traced.nuv.cx server { } block, next to "location = /" (run.sh / landing stay as they are)
location ^~ /t/ {
    proxy_pass http://127.0.0.1:7480;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;      # the peer (cloudflare edge); traced trusts CF-Connecting-IP only from cf ranges
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /api/ {
    client_max_body_size 600k;
    proxy_pass http://127.0.0.1:7480;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
